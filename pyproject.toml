[project]
name = "fasim3"
version = "1.0.0"
description = "FASIM III discrete-event simulator with Pygame graphics"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["pygame-ce>=2.5.8,<3"]

[project.scripts]
fasim3 = "FASIM3:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["FASIM3.py"]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
target-version = "py314"
line-length = 100
show-fixes = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
